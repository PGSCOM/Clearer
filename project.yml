name: Clearer

options:
  bundleIdPrefix: com.pablogarcia.clearer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: es

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "Clearer"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Clearer necesita ver tus fotos para ayudarte a encontrar las que sobran. El análisis pasa entero en tu iPhone y las fotos que solo están en iCloud no se descargan."
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  Clearer:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogarcia.clearer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

  ClearerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Clearer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogarcia.clearer.tests

  ClearerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: Clearer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogarcia.clearer.uitests

schemes:
  Clearer:
    build:
      targets:
        Clearer: all
        ClearerTests: [test]
        ClearerUITests: [test]
    test:
      targets:
        - ClearerTests
        - ClearerUITests
    run:
      config: Debug
    archive:
      config: Release
