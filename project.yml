name: FotIACleaner

options:
  bundleIdPrefix: com.pablogarcia.fotiacleaner
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only for v1
    GENERATE_INFOPLIST_FILE: YES
    INFOPLIST_KEY_CFBundleDisplayName: "FotIA Cleaner"
    INFOPLIST_KEY_UILaunchScreen_Generation: YES
    INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "FotIA Cleaner necesita ver tus fotos para ayudarte a encontrar las que sobran. El análisis pasa entero en tu iPhone y las fotos que solo están en iCloud no se descargan."
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  FotIACleaner:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogarcia.fotiacleaner

  FotIACleanerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FotIACleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogarcia.fotiacleaner.tests

  FotIACleanerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: UITests
    dependencies:
      - target: FotIACleaner
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.pablogarcia.fotiacleaner.uitests

schemes:
  FotIACleaner:
    build:
      targets:
        FotIACleaner: all
        FotIACleanerTests: [test]
        FotIACleanerUITests: [test]
    test:
      targets:
        - FotIACleanerTests
        - FotIACleanerUITests
    run:
      config: Debug
    archive:
      config: Release
